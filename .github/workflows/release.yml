# Builds Digonto Studio WITH every Digonto program inside (one download, one runtime) on GitHub's own computers.
#   Linux .deb, macOS .dmg (Apple silicon: M1 and newer), Windows .exe installer.
# The programs are taken from their own repositories (latest version of each).
# Start it: push a tag like v2.9.0  or press "Run workflow" on the Actions page.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APPS: digonto-audio digonto-dtfrip digonto-images digonto-logo digonto-pdf digonto-player digonto-qr digonto-sheets digonto-ssh digonto-sublimation digonto-tools digonto-vector digonto-write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04      # the Qt libraries need Ubuntu 24.04 / Debian 13 or newer
          - os: windows-latest
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/digonto-studio
      - name: Get every program
        shell: bash
        run: |
          for a in $APPS; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$a.git" "src/$a"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries (exact versions, SHA-256 checked)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          REQ=""
          for d in src/digonto-*; do REQ="$REQ -r $d/requirements.txt"; done
          python -m pip install --require-hashes $REQ
          python -m pip install pyinstaller==6.22.3
      - name: Inno Setup (Windows installer maker)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: bash
        run: python src/digonto-studio/packaging/build.py --root src --apps all --package digonto-studio --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: digonto-studio-${{ matrix.os }}
          path: dist/*
      - name: Put the installer on the Releases page
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
