# Builds Digonto Studio WITH every Digonto program inside (one download, one runtime) on GitHub's own computers.
#   Linux .deb, macOS .dmg, Windows .exe - each opens the Digonto installer window (choose the programs).
# The programs are taken from their own repositories (latest version of each).
# Start it: on the Actions page press \"Run workflow\" and tick \"Publish\" (or push a tag like v2.9.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Put the installers on the Releases page (version from digonto-app.json)"
        type: boolean
        default: false
      apps_branch:
        description: "Take the programs from this branch where it exists (for testing)"
        type: string
        default: main

permissions:
  contents: write

env:
  APPS: digonto-audio digonto-dtfrip digonto-images digonto-logo digonto-pdf digonto-player digonto-qr digonto-sheets digonto-ssh digonto-sublimation digonto-tools digonto-vector digonto-write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04      # the Qt libraries need Ubuntu 24.04 / Debian 13 or newer
          - os: windows-latest
          - os: macos-15-intel    # all Macs: runs natively on Intel, through Rosetta 2 on Apple silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: src/digonto-studio
      - name: Get every program
        shell: bash
        run: |
          BR="${{ inputs.apps_branch || 'main' }}"
          for a in $APPS; do
            git clone --depth 1 -b "$BR" "https://github.com/${{ github.repository_owner }}/$a.git" "src/$a" 2>/dev/null \
              || git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$a.git" "src/$a"
            echo "$a: $(git -C src/$a rev-parse --abbrev-ref HEAD)"
          done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Libraries (exact versions, SHA-256 checked)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          REQ=""
          for d in src/digonto-*; do
            f=$d/requirements.txt
            if [ "$RUNNER_OS" = "macOS" ] && [ "$RUNNER_ARCH" = "X64" ] && [ -f $d/requirements-macos-intel.txt ]; then f=$d/requirements-macos-intel.txt; fi
            REQ="$REQ -r $f"
          done
          python -m pip install --require-hashes $REQ
          python -m pip install pyinstaller==6.22.3
      - name: NSIS (packs the Windows setup .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: dmgbuild (makes the Mac disk window with its background)
        if: runner.os == 'macOS'
        shell: bash
        run: python -m pip install "dmgbuild>=1.6,<2"
      - name: Offline AI (background removal helper for this system, plus the Apple-chip one on macOS)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash src/digonto-studio/packaging/ai/build-ai-ci.sh "$GITHUB_WORKSPACE/ai"
      - name: Build
        shell: bash
        env:
          DIGONTO_AI_DIR: ${{ github.workspace }}/ai
        run: python src/digonto-studio/packaging/build.py --root src --apps all --package digonto-studio --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: digonto-studio-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "tag=v$(python3 -c 'import json;print(json.load(open("digonto-app.json"))["version"])')" >> "$GITHUB_OUTPUT"; fi
          echo "name=$(python3 -c 'import json;print(json.load(open("digonto-app.json"))["name"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Fixed-name copy (stable download link for digonto.dev)
        shell: bash
        run: |
          N="${{ github.event.repository.name }}"
          for f in dist/*; do
            case "$f" in
              *.exe) cp "$f" "dist/$N-windows.exe" ;;
              *.dmg) cp "$f" "dist/$N-macos.dmg" ;;
              *.deb) cp "$f" "dist/$N-linux.deb" ;;
            esac
          done
          ls -la dist
      - name: Put the installers on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.name }} ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Offline installers - no account, no internet needed.
            - Windows 10/11: the `.exe` setup
            - macOS 13 or newer (Intel and Apple silicon): the `.dmg`
              First start: System Settings > Privacy & Security > Open Anyway (not signed by Apple yet).
            - Ubuntu 24.04+ / Debian 13+: the `.deb`
          files: dist/*
